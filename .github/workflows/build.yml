name: Build & Release

on:
  push:
    tags:
      - 'v*'

# Read-only by default. Only the release job, which runs no third-party build
# code, gets write access.
permissions:
  contents: read

# Supply-chain hardening:
# - Actions are pinned to full commit SHAs (a moved tag can't swap in new code).
# - No build cache: release binaries are built from a clean state with --locked.
# - The tag is passed to scripts through env, never pasted into them.
# - CI only creates a *draft* release. The maintainer verifies and signs
#   SHA256SUMS with the offline release key (.github/scripts/sign-release.sh),
#   which publishes it. Clients refuse updates without that signature, so a
#   compromised CI or GitHub account can't ship an update on its own.

jobs:
  # The tag is the version: it is compiled into the binary as PROBE_VERSION,
  # so Cargo.toml never needs bumping. The in-app updater only understands
  # plain vX.Y.Z, so refuse to release anything else.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Read version from tag
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag $TAG is not of the form vX.Y.Z"
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      # A build with the placeholder key would refuse every future update.
      - name: Check the release public key is real
        run: |
          key="$(sed -n 2p src/update/release-key.pub)"
          bytes="$(printf %s "$key" | base64 -d 2>/dev/null | wc -c)"
          prefix="$(printf %s "$key" | base64 -d 2>/dev/null | head -c 2)"
          if [[ "$bytes" -ne 42 || "$prefix" != "Ed" ]]; then
            echo "::error::src/update/release-key.pub is not a minisign public key (see docs/RELEASING.md)"
            exit 1
          fi

  build:
    needs: [version]
    strategy:
      matrix:
        include:
          # The binary links against the build machine's glibc; ubuntu-latest (26.04, glibc 2.43)
          # produced binaries that won't start on Ubuntu 24.04 / Mint 22. 22.04 (glibc 2.35) keeps
          # the requirement low so the binary runs on older distributions.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: probe
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: probe.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxinerama-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libgtk-3-dev

      - name: Build release
        env:
          PROBE_VERSION: ${{ needs.version.outputs.version }}
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: probe-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.artifact }}

  release:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # full history + tags for the changelog

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release

          # Linux: single binary
          cp artifacts/probe-x86_64-unknown-linux-gnu/probe release/probe-linux-x86_64
          chmod +x release/probe-linux-x86_64

          # Windows: single exe
          cp artifacts/probe-x86_64-pc-windows-msvc/probe.exe release/probe-windows-x86_64.exe

          # Checksums the maintainer signs and the in-app updater verifies against
          (cd release && sha256sum probe-linux-x86_64 probe-windows-x86_64.exe > SHA256SUMS)

      - name: Generate changelog
        env:
          TAG: ${{ github.ref_name }}
        run: bash .github/scripts/changelog.sh "$TAG" > notes.md

      # A draft is invisible to the updater and the site until sign-release.sh
      # signs and publishes it (which also triggers the site rebuild).
      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --draft \
            --title "$TAG" \
            --notes-file notes.md \
            release/probe-linux-x86_64 \
            release/probe-windows-x86_64.exe \
            release/SHA256SUMS
