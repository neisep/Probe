name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # The tag is the version: it is compiled into the binary as PROBE_VERSION,
  # so Cargo.toml never needs bumping. The in-app updater only understands
  # plain vX.Y.Z, so refuse to release anything else.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Read version from tag
        id: tag
        run: |
          tag="${{ github.ref_name }}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag $tag is not of the form vX.Y.Z"
            exit 1
          fi
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

  build:
    needs: [version]
    strategy:
      matrix:
        include:
          # The binary links against the build machine's glibc; ubuntu-latest (26.04, glibc 2.43)
          # produced binaries that won't start on Ubuntu 24.04 / Mint 22. 22.04 (glibc 2.35) keeps
          # the requirement low so the binary runs on older distributions.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: probe
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: probe.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxinerama-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libgtk-3-dev

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # Keyed on the image, not just the OS: build output from a newer image must
          # not be reused on an older one.
          key: ${{ matrix.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ matrix.os }}-cargo-

      - name: Build release
        env:
          PROBE_VERSION: ${{ needs.version.outputs.version }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: probe-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.artifact }}

  release:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags for the changelog

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release

          # Linux: single binary
          cp artifacts/probe-x86_64-unknown-linux-gnu/probe release/probe-linux-x86_64
          chmod +x release/probe-linux-x86_64

          # Windows: single exe
          cp artifacts/probe-x86_64-pc-windows-msvc/probe.exe release/probe-windows-x86_64.exe

          # Checksums the in-app updater verifies downloads against
          (cd release && sha256sum probe-linux-x86_64 probe-windows-x86_64.exe > SHA256SUMS)

      - name: Generate changelog
        run: bash .github/scripts/changelog.sh "${{ github.ref_name }}" > notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes-file notes.md \
            release/probe-linux-x86_64 \
            release/probe-windows-x86_64.exe \
            release/SHA256SUMS

      - name: Trigger site rebuild
        env:
          # Fine-grained PAT with Actions: Read and write on neisep.github.io only.
          GH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: gh api -X POST repos/neisep/neisep.github.io/actions/workflows/deploy.yml/dispatches -f ref=master
